<article class="post-item">
  <div class="post-item-meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
    {{- with .CurrentSection }}{{ if not .IsHome }}<span class="sep">·</span><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}{{ end }}
    <span class="sep">·</span><span>{{ .ReadingTime }} min read</span>
  </div>
  <h2 class="post-item-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  {{- with .Description | default (.Summary | plainify | truncate 220) }}<p class="post-item-desc">{{ . }}</p>{{ end }}
</article>
