<header class="site-header">
  <div class="wrap header-inner">
    <a class="site-title" href="/">{{ site.Title }}</a>
    <nav class="site-nav" aria-label="Main">
      {{- $cur := . }}
      {{- range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or ($cur.IsMenuCurrent "main" .) (eq (strings.TrimSuffix "/" $cur.RelPermalink) (strings.TrimSuffix "/" .URL)) (and $cur.IsPage (eq (printf "/%s/" $cur.Section) .URL)) }} class="is-current" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
    <button class="theme-toggle" type="button" id="themeToggle" aria-label="Theme" title="Theme">
        <svg class="i-white" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
        <svg class="i-night" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
        <svg class="i-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg>
      </button>
  </div>
</header>
