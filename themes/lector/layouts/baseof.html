<!doctype html>
<html lang="{{ site.Language.Lang | default "en" }}" data-theme="white">
<head>
{{ partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}{{ with .Section }} section-{{ . }}{{ if in site.Params.wings.humanities . }} wing-humanities{{ end }}{{ end }}">

{{ partial "header.html" . }}
<main id="main" class="wrap">

</main>
{{ partial "footer.html" . }}
</body>
</html>
