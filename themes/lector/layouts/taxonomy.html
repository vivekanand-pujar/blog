{{ define "main" }}
<header class="page-head"><h1 class="page-title">{{ .Title }}</h1></header>
<ul class="tag-cloud">
  {{- range .Data.Terms.ByCount }}
  <li><a href="{{ .Page.RelPermalink }}">#{{ .Page.Title }}<span class="count">{{ .Count }}</span></a></li>
  {{- else }}<li class="empty">No tags yet.</li>{{ end }}
</ul>
{{ end }}
