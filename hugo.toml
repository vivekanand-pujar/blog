baseURL = "https://vivekanand.dev/"
locale = "en-US"
title = "Vivekanand Pujar"
theme = "lector"
enableRobotsTXT = true
titleCaseStyle = "none"     # keep titles and tag names exactly as written
enableGitInfo = true          # "Updated" dates come from the last commit that touched a post

[pagination]
pagerSize = 12

[taxonomies]
tag = "tags"

[params]
author = "Vivekanand Pujar"
description = "Technical deep dives, architecture notes, white papers, and essays."
tagline = "Distributed systems, Kubernetes, cloud infrastructure, observability, and software architecture."
mainSections = ["papers", "deep-dives", "essays", "marginalia", "translations"]   # everything that is a "post"
images = ["images/og-default.png"]   # default share image (Open Graph / Twitter)
toc = false                           # per post: toc = true
comments = true                       # per post: comments = false

brandline = "Architecture · Platform · Infrastructure"   # small line under the name in the header (hidden on phones)

# Two wings: technical writing, and the humanities (philosophy, books, Sanskrit translation)
[params.wings]
technical = ["papers", "deep-dives", "essays"]
humanities = ["marginalia", "translations"]

# Header icons (LinkedIn shows once a URL is set)
[params.social]
github = "https://github.com/vivekanand-pujar"
linkedin = "https://www.linkedin.com/in/vivekanandpujar/"

# Giscus (GitHub Discussions). Comments render only once repoId and categoryId are set.
[params.giscus]
repo = "vivekanand-pujar/blog"
repoId = "R_kgDOT_o1sg"
category = "Comments"
categoryId = "DIC_kwDOT_o1ss4DLQLN"
mapping = "pathname"

[[menu.main]]
name = "White Papers"
url = "/papers/"
weight = 10

[[menu.main]]
name = "Deep Dives"
url = "/deep-dives/"
weight = 20

[[menu.main]]
name = "Essays"
url = "/essays/"
weight = 30

[[menu.main]]
name = "Marginalia"
url = "/marginalia/"
weight = 32
[menu.main.params]
group = "humanities"

[[menu.main]]
name = "Translations"
url = "/translations/"
weight = 34
[menu.main.params]
group = "humanities"

[[menu.main]]
name = "About"
url = "/about/"
weight = 40
[menu.main.params]
group = "site"

[markup.goldmark.renderer]
unsafe = true                         # own writing only: allows <kbd>, <details>, <sup> … (CSP still blocks scripts)

[markup.goldmark.parser.attribute]
block = true

[markup.highlight]
noClasses = false                     # colours come from the theme's CSS (Obsidian/Adversaria palette)
lineNos = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3

# Feeds: /index.xml = everything; /technical.xml and /humanities.xml = one wing each; every section has its own index.xml
[outputFormats.TechRSS]
mediaType = "application/rss+xml"
baseName = "technical"
rel = "alternate"
isHTML = false
noUgly = true

[outputFormats.HumRSS]
mediaType = "application/rss+xml"
baseName = "humanities"
rel = "alternate"
isHTML = false
noUgly = true

[outputs]
home = ["HTML", "RSS", "TechRSS", "HumRSS"]
section = ["HTML", "RSS"]

[services.rss]
limit = 30
